<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Resultado de Evaluación</title>
    <style>
        body {
            background-color: #f4f7fb;
        }
        .result-container {
            max-width: 720px;
            margin: 40px auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }
        .yes {
            color: #198754;
            font-weight: 600;
        }
        .no {
            color: #dc3545;
            font-weight: 600;
        }
        .ai-box {
            white-space: pre-wrap;
            background: #f8f9fa;
            border-left: 4px solid #0d6efd;
            padding: 15px;
        }
    </style>
</head>
<body>
<!--
  Resultado de la evaluación (AirlineController#evaluateWeb).
  Modelo: airlineResponse (AirlineResponse) y, si se pidió, aiExplanation (String).
-->
<div class="result-container" th:with="r=${airlineResponse}">
    <h2>Resultado de la Evaluación</h2>

    <table class="table table-sm mt-3">
        <tbody>
        <tr>
            <th>Clase</th>
            <td th:text="${r.seatClass}"></td>
        </tr>
        <tr>
            <th>Elegible para ascensos</th>
            <td><span th:class="${r.upgradeEligible} ? 'yes' : 'no'" th:text="${r.upgradeEligible} ? 'Sí' : 'No'"></span></td>
        </tr>
        <tr>
            <th>Check-in prioritario</th>
            <td><span th:class="${r.priorityCheckIn} ? 'yes' : 'no'" th:text="${r.priorityCheckIn} ? 'Sí' : 'No'"></span></td>
        </tr>
        <tr>
            <th>Asiento asignado</th>
            <td th:text="${r.assignedSeat}"></td>
        </tr>
        <tr>
            <th>Descuento</th>
            <td th:text="${#numbers.formatDecimal(r.discountPercentage, 1, 0)} + '%'"></td>
        </tr>
        <tr>
            <th>Precio final</th>
            <td th:text="'$' + ${#numbers.formatDecimal(r.finalPrice, 1, 'COMMA', 2, 'POINT')}"></td>
        </tr>
        <tr>
            <th>Compensación</th>
            <td th:text="'$' + ${#numbers.formatDecimal(r.compensation, 1, 'COMMA', 2, 'POINT')}"></td>
        </tr>
        <tr>
            <th>Puntos de lealtad extra</th>
            <td th:text="${r.extraLoyaltyPoints}"></td>
        </tr>
        <tr>
            <th>Equipaje permitido</th>
            <td><span th:class="${r.luggageAllowed} ? 'yes' : 'no'" th:text="${r.luggageAllowed} ? 'Sí' : 'No'"></span></td>
        </tr>
        <tr>
            <th>Acceso a salón VIP</th>
            <td><span th:class="${r.vipLoungeAccess} ? 'yes' : 'no'" th:text="${r.vipLoungeAccess} ? 'Sí' : 'No'"></span></td>
        </tr>
        </tbody>
    </table>

    <!-- appliedRules y messages tienen el mismo orden: el índice une cada regla con su mensaje -->
    <h4 class="mt-4">Reglas activadas</h4>
    <p th:if="${#lists.isEmpty(r.appliedRules)}" class="text-muted">No se activó ninguna regla.</p>
    <ul class="list-group" th:unless="${#lists.isEmpty(r.appliedRules)}">
        <li class="list-group-item" th:each="rule, it : ${r.appliedRules}">
            <strong th:text="${rule}"></strong><br>
            <small th:text="${r.messages[it.index]}"></small>
        </li>
    </ul>

    <div th:if="${aiExplanation != null}" class="mt-4">
        <h4>Explicación de la IA</h4>
        <div class="ai-box" th:text="${aiExplanation}"></div>
    </div>

    <a class="btn btn-outline-primary mt-4" th:href="@{/airline/form}">Evaluar otro pasajero</a>
</div>
</body>
</html>
