<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Evaluación de Pasajero</title>
    <style>
        body {
            background-color: #f4f7fb;
        }
        .form-container {
            max-width: 720px;
            margin: 40px auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }
        .error {
            color: #dc3545;
            font-size: 0.875em;
            display: block;
        }
        h3 {
            font-size: 1.15rem;
            margin-top: 1.5rem;
            color: #0d6efd;
        }
    </style>
</head>
<body>
<div class="form-container">
    <h2>Evaluación de Pasajero - Aerolínea</h2>
    <p class="text-muted">Reglas de negocio ejecutadas con Drools.</p>

    <form th:action="@{/airline/evaluate}" th:object="${airlineRequest}" method="post">
        <h3>Datos del Pasajero</h3>
        <div class="row g-3">
            <div class="col-md-8">
                <label for="name" class="form-label">Nombre</label>
                <input type="text" id="name" class="form-control" th:field="*{passenger.name}">
                <span class="error" th:errors="*{passenger.name}"></span>
            </div>
            <div class="col-md-4">
                <label for="age" class="form-label">Edad</label>
                <input type="number" id="age" class="form-control" th:field="*{passenger.age}">
                <span class="error" th:errors="*{passenger.age}"></span>
            </div>
            <div class="col-md-6">
                <label for="membershipStatus" class="form-label">Membresía</label>
                <select id="membershipStatus" class="form-select" th:field="*{passenger.membershipStatus}">
                    <option value="">Seleccione</option>
                    <option value="Basic">Basic</option>
                    <option value="Silver">Silver</option>
                    <option value="Gold">Gold</option>
                    <option value="Platinum">Platinum</option>
                </select>
                <span class="error" th:errors="*{passenger.membershipStatus}"></span>
            </div>
            <div class="col-md-6">
                <label for="seatPreference" class="form-label">Preferencia de asiento</label>
                <select id="seatPreference" class="form-select" th:field="*{passenger.seatPreference}">
                    <option value="">Seleccione</option>
                    <option value="Any">Sin preferencia (Any)</option>
                    <option value="Window">Ventana (Window)</option>
                    <option value="Aisle">Pasillo (Aisle)</option>
                </select>
                <span class="error" th:errors="*{passenger.seatPreference}"></span>
            </div>
            <div class="col-md-6">
                <label for="luggageWeight" class="form-label">Peso del equipaje (kg)</label>
                <input type="number" id="luggageWeight" class="form-control" step="0.1" th:field="*{passenger.luggageWeight}">
                <span class="error" th:errors="*{passenger.luggageWeight}"></span>
            </div>
            <div class="col-md-6 d-flex align-items-end">
                <div class="form-check">
                    <input type="checkbox" id="travelingWithChildren" class="form-check-input" th:field="*{passenger.travelingWithChildren}">
                    <label for="travelingWithChildren" class="form-check-label">Viaja con niños</label>
                </div>
            </div>
        </div>

        <h3>Datos del Vuelo</h3>
        <div class="row g-3">
            <div class="col-md-6">
                <label for="flightNumber" class="form-label">Número de vuelo</label>
                <input type="text" id="flightNumber" class="form-control" th:field="*{flight.flightNumber}">
                <span class="error" th:errors="*{flight.flightNumber}"></span>
            </div>
            <div class="col-md-6">
                <label for="ticketPrice" class="form-label">Precio del tiquete ($)</label>
                <input type="number" id="ticketPrice" class="form-control" step="0.01" th:field="*{flight.ticketPrice}">
                <span class="error" th:errors="*{flight.ticketPrice}"></span>
            </div>
            <div class="col-md-6">
                <label for="delayMinutes" class="form-label">Retraso (minutos)</label>
                <input type="number" id="delayMinutes" class="form-control" th:field="*{flight.delayMinutes}">
                <span class="error" th:errors="*{flight.delayMinutes}"></span>
            </div>
            <div class="col-md-6">
                <label for="durationHours" class="form-label">Duración del vuelo (horas)</label>
                <input type="number" id="durationHours" class="form-control" step="0.1" th:field="*{flight.durationHours}">
                <span class="error" th:errors="*{flight.durationHours}"></span>
            </div>
            <div class="col-12">
                <div class="form-check">
                    <input type="checkbox" id="emergencyExitSeatAvailable" class="form-check-input" th:field="*{flight.emergencyExitSeatAvailable}">
                    <label for="emergencyExitSeatAvailable" class="form-check-label">Hay asiento de salida de emergencia disponible</label>
                </div>
            </div>
        </div>

        <div class="form-check mt-4">
            <input type="checkbox" id="explain" name="explain" value="true" class="form-check-input" checked>
            <label for="explain" class="form-check-label">Explicar el resultado con IA</label>
        </div>

        <button type="submit" class="btn btn-primary mt-3">Evaluar Pasajero</button>
    </form>
</div>
</body>
</html>
