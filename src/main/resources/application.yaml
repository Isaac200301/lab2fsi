spring:
  application:
    name: labdrools
  ai:
    openai:
      # Proveedor de IA compatible con la API de OpenAI. Por defecto Groq (plan gratuito).
      # La API key se lee de la variable de entorno AI_API_KEY (nunca se sube al repositorio).
      api-key: ${AI_API_KEY:sin-configurar}
      base-url: ${AI_BASE_URL:https://api.groq.com/openai}
      chat:
        options:
          model: ${AI_MODEL:openai/gpt-oss-120b}
          temperature: 0.3
