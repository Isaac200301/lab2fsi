spring:
  application:
    name: labdrools
  ai:
    openai:
      # Proveedor de IA compatible con la API de OpenAI. Por defecto Groq (plan gratuito).
      # La API key se lee de la variable de entorno AI_API_KEY (nunca se sube al repositorio).
      # Si no está definida, la aplicación arranca igual y la explicación de IA indica que falta.
      api-key: ${AI_API_KEY:sin-configurar}
      # Para usar OpenAI directamente: AI_BASE_URL=https://api.openai.com y AI_MODEL=gpt-4o-mini
      base-url: ${AI_BASE_URL:https://api.groq.com/openai}
      chat:
        options:
          model: ${AI_MODEL:openai/gpt-oss-120b}
          # Valor bajo para que la explicación sea estable y se ciña a los datos
          temperature: 0.3
